services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      REDIS_ADDR: redis:6379
      SERVER_PORT: "3000"
    depends_on:
      redis:
        condition: service_healthy
